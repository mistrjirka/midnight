name: Build experimental Midnight firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev python3-docutils
      - name: Reproduce both camera builds and run native tests
        run: bash scripts/build.sh
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midnight-experimental-firmware
          path: dist/magiclantern-astro-*.zip
          if-no-files-found: error
      - name: Publish experimental prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.2-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/magiclantern-astro-*.zip --clobber
          else
            gh release create "$tag" dist/magiclantern-astro-*.zip --prerelease --title "Midnight default focus shortcut and 600D QEMU photo tests" --notes "EXPERIMENTAL. DISP on 600D and LCD light on 6D act as focus shortcuts in photo LiveView. Turn this off in Astronomy settings to restore normal buttons. 600D QEMU solves processed user star field with 16 matched stars. Physical camera and autofocus motor not tested. Blind solving not implemented. Use a spare SD card."
          fi
