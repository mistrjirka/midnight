name: Build experimental Midnight firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-dev python3-docutils
      - name: Reproduce both camera builds and run native tests
        run: bash scripts/build.sh
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midnight-experimental-firmware
          path: dist/magiclantern-astro-*.zip
          if-no-files-found: error
      - name: Publish experimental prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.2.4-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/magiclantern-astro-*.zip --clobber
          else
            gh release create "$tag" dist/magiclantern-astro-*.zip --prerelease --title "Midnight gallery preview solving and decimal-degree coordinates" --notes "EXPERIMENTAL. Integer star-profile filter, Hough satellite-trail rejection and improved sky projection. 600D QEMU matches 16 and 8 stars in two processed real-photo frames, including a satellite trail. This is still hinted solving of LiveView, not automatic exposure or blind solving. Physical camera and autofocus motor not tested. Use a spare SD card."
          fi
